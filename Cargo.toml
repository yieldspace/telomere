[package]
name = "telomere"
version = "0.1.0"
edition = "2021"

[dependencies]
thiserror = "2.0.11"
bytes = "1.10.0"
bumpalo = { version = "3.17.0", features = ["collections"] }
tracing = { version = "0.1.41" }

[dev-dependencies]
wast = { version = "226.0.0" }
tracing-subscriber = { version = "0.3.19" }
wat = {version = "1.227.1", features = ["component-model"]}

[features]
default = ["interpreter", "component-model"]
interpreter = []
async = []
import_export = []

component-model = []
