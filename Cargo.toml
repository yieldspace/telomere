[package]
name = "telomere-cli"
description = "Command-line runner for the telomere WebAssembly runtime."
version.workspace = true
rust-version.workspace = true
edition.workspace = true
authors.workspace = true
homepage.workspace = true
publish.workspace = true
license.workspace = true
autoexamples = false

[features]
default = ["full"]
full = [
    "telomere/full",
    "telomere-component/simd",
    "telomere-component/threads",
    "telomere-component-wasi/simd",
    "telomere-component-wasi/threads",
]
jit = ["telomere/jit"]
vm-profile = ["telomere/vm-profile"]
vm-diagnostics = ["telomere/vm-diagnostics"]
measure-switches = ["telomere/measure-switches"]

[dependencies]
clap = { version = "4.5.37", features = ["derive"] }
anyhow = "1.0.98"
libc.workspace = true
telomere = { path = "crates/telomere", default-features = false, features = ["unstable-internals"] }
telomere-component = { path = "crates/telomere-component", default-features = false }
telomere-component-wasi = { path = "crates/telomere-component-wasi", default-features = false }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }

[dev-dependencies]
wat = "1.243.0"

[workspace]
resolver = "2"
members = [
    "crates/telomere",
    "crates/telomere-jit-codegen",
    "crates/telomere-component",
    "crates/telomere-component-bindgen",
    "crates/telomere-component-wasi",
    "crates/telomere-macros",
    "crates/union-find",
    "examples/minimal-embedder",
]

[workspace.package]
version = "0.1.0-alpha.1"
rust-version = "1.86.0"
edition = "2021"
publish = false
license = "Apache-2.0"
authors = ["sizumita", "tignear"]
homepage = "https://github.com/yieldspace/telomere"
keywords = ["webassembly", "runtime"]

[workspace.dependencies]
telomere = { path = "crates/telomere" }
telomere-jit-codegen = { path = "crates/telomere-jit-codegen" }
telomere-component = { path = "crates/telomere-component" }
telomere-component-bindgen = { path = "crates/telomere-component-bindgen" }
union-find = {path = "crates/union-find"}
telomere-macros = { path = "crates/telomere-macros" }
tokio = { version = "1.0", default-features = false }
getrandom = "0.3.3"
libc = "0.2.175"
mmap-rs = "0.7.0"
smallvec = "1.14.0"

[profile.release]
codegen-units = 1
lto = "thin"

[profile.release-profiling]
inherits = "release"
debug = 1
strip = "none"

[profile.release-size]
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
debug = false
overflow-checks = false
