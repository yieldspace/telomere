[package]
name = "telomere-cli"
version.workspace = true
rust-version.workspace = true
edition.workspace = true
authors.workspace = true
homepage.workspace = true
publish.workspace = true

[features]
default = ["full"]
full = ["telomere/full"]
jit = ["telomere/jit"]
vm-profile = ["telomere/vm-profile"]
vm-diagnostics = ["telomere/vm-diagnostics"]

[dependencies]
clap = { version = "4.5.37", features = ["derive"] }
anyhow = "1.0.98"
libc.workspace = true
telomere = { path = "crates/telomere", default-features = false }
telomere-component.workspace = true
telomere-component-wasi = { path = "crates/telomere-component-wasi" }
tokio.workspace = true

[dev-dependencies]
wat = "1.243.0"

[workspace]
resolver = "2"
members = [
    "crates/telomere",
    "crates/telomere-component",
    "crates/telomere-component-bindgen",
    "crates/telomere-component-wasi",
    "crates/telomere-macros",
    "crates/union-find"
]

[workspace.package]
version = "0.1.0"
rust-version = "1.86.0"
edition = "2021"
publish = false
authors = ["sizumita", "tignear"]
homepage = "https://github.com/yieldspace/telomere"
keywords = ["webassembly", "runtime"]

[workspace.dependencies]
telomere = { path = "crates/telomere" }
telomere-component = { path = "crates/telomere-component" }
telomere-component-bindgen = { path = "crates/telomere-component-bindgen" }
union-find = {path = "crates/union-find"}
telomere-macros = { path = "crates/telomere-macros" }
tokio = { version = "1.0", features = ["full"] }
getrandom = "0.3.3"
libc = "0.2.175"
mmap-rs = "0.7.0"

regex = "1.11.1"

[profile.release]
codegen-units = 1
lto = "thin"
