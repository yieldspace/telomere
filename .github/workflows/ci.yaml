name: Rust CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  workspace-test:
    name: Workspace tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96.0"

      - name: Cache
        uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --verbose --release --workspace

  minimal-embedder:
    name: Standalone minimal embedder
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96.0"

      - name: Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: minimal-embedder

      - name: Check minimal core crate
        run: cargo check -p telomere --no-default-features --features simd

      - name: Check minimal component crate
        run: cargo check -p telomere-component --no-default-features --features simd

      - name: Assert minimal core crate has no Tokio dependency
        shell: bash
        run: |
          if ! inverse="$(cargo tree -p telomere -e normal --no-default-features --features simd -i tokio)"; then
            echo '::error::cargo tree guard failed'
            exit 1
          fi
          if [[ -n "$inverse" ]]; then
            echo '::error::tokio is present in telomere minimal normal graph'
            printf '%s\n' "$inverse"
            exit 1
          fi

      - name: Assert minimal component crate has no Tokio dependency
        shell: bash
        run: |
          if ! inverse="$(cargo tree -p telomere-component -e normal --no-default-features --features simd -i tokio)"; then
            echo '::error::cargo tree guard failed'
            exit 1
          fi
          if [[ -n "$inverse" ]]; then
            echo '::error::tokio is present in telomere-component minimal normal graph'
            printf '%s\n' "$inverse"
            exit 1
          fi

      - name: Test parser feature gates without threads
        run: cargo test -p telomere --no-default-features --features simd --test parser_feature_gates

      - name: Check telomere without default features
        run: cargo check -p telomere --no-default-features

      - name: Test telomere without default features
        run: cargo test -p telomere --release --no-default-features

  jit-native-test:
    name: JIT tests (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-apple-darwin
            os: macos-15-intel
          - target: aarch64-apple-darwin
            os: macos-14

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96.0"
          targets: ${{ matrix.target }}

      - name: Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: jit-native-${{ matrix.target }}

      - name: Check JIT target
        run: cargo check -p telomere --features jit --target ${{ matrix.target }}

      - name: JIT regression tests
        run: cargo test -p telomere --release --features jit --target ${{ matrix.target }} --test jit

      - name: JIT CLI smoke test
        shell: bash
        run: |
          output="$(cargo run --quiet --features jit --target ${{ matrix.target }} -- --jit examples/add.wasm main 1 2)"
          if [ "$output" != "3" ]; then
            echo "expected 3, got: $output"
            exit 1
          fi

      - name: JIT wast conformance
        env:
          TELOMERE_WAST_JIT: "1"
          TELOMERE_WAST_JIT_REQUIRE_ACCEPT: "1"
        run: cargo test -p telomere --release --features jit --target ${{ matrix.target }} --test wast

  jit-cross-check:
    name: JIT cross-check (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - riscv64gc-unknown-linux-gnu

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96.0"
          targets: ${{ matrix.target }}

      - name: Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: jit-cross-${{ matrix.target }}

      - name: Check core JIT target
        run: cargo check -p telomere --features jit --target ${{ matrix.target }}

      - name: Check CLI JIT target
        run: cargo check -p telomere-cli --features jit --target ${{ matrix.target }}

  jit-riscv64-qemu:
    name: JIT riscv64 QEMU
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96.0"
          targets: riscv64gc-unknown-linux-gnu

      - name: Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: jit-riscv64-qemu

      - name: Install riscv64 QEMU dependencies
        run: sudo apt-get update && sudo apt-get install -y gcc-riscv64-linux-gnu qemu-user-static

      - name: Non-JIT interpreter tests under QEMU
        env:
          CARGO_TARGET_RISCV64GC_UNKNOWN_LINUX_GNU_LINKER: riscv64-linux-gnu-gcc
          CARGO_TARGET_RISCV64GC_UNKNOWN_LINUX_GNU_RUNNER: qemu-riscv64-static -L /usr/riscv64-linux-gnu
        run: cargo test -p telomere --release --target riscv64gc-unknown-linux-gnu --test effect -- --test-threads 1 --nocapture

      - name: JIT regression tests under QEMU
        env:
          CARGO_TARGET_RISCV64GC_UNKNOWN_LINUX_GNU_LINKER: riscv64-linux-gnu-gcc
          CARGO_TARGET_RISCV64GC_UNKNOWN_LINUX_GNU_RUNNER: qemu-riscv64-static -L /usr/riscv64-linux-gnu
        run: cargo test -p telomere --release --features jit --target riscv64gc-unknown-linux-gnu --test jit -- --test-threads 1 --nocapture

      - name: JIT wast conformance under QEMU
        env:
          CARGO_TARGET_RISCV64GC_UNKNOWN_LINUX_GNU_LINKER: riscv64-linux-gnu-gcc
          CARGO_TARGET_RISCV64GC_UNKNOWN_LINUX_GNU_RUNNER: qemu-riscv64-static -L /usr/riscv64-linux-gnu
          TELOMERE_WAST_JIT: "1"
          TELOMERE_WAST_JIT_REQUIRE_ACCEPT: "1"
        run: cargo test -p telomere --release --features jit --target riscv64gc-unknown-linux-gnu --test wast

  packaging:
    name: Packaging metadata
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96.0"

      - name: Cache
        uses: Swatinem/rust-cache@v2

      - name: Check packaging metadata
        run: python3 tools/check-packaging.py
