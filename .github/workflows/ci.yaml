name: Rust CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  workspace-test:
    name: Workspace tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96.0"

      - name: Cache
        uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --verbose --release --workspace

  minimal-embedder:
    name: Standalone minimal embedder
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96.0"

      - name: Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: minimal-embedder

      - name: Check minimal core crate
        run: cargo check -p telomere --no-default-features --features simd

      - name: Check minimal component crate
        run: cargo check -p telomere-component --no-default-features --features simd

      - name: Assert minimal core crate has no Tokio dependency
        shell: bash
        run: |
          if ! inverse="$(cargo tree -p telomere -e normal --no-default-features --features simd -i tokio)"; then
            echo '::error::cargo tree guard failed'
            exit 1
          fi
          if [[ -n "$inverse" ]]; then
            echo '::error::tokio is present in telomere minimal normal graph'
            printf '%s\n' "$inverse"
            exit 1
          fi

      - name: Assert minimal component crate has no Tokio dependency
        shell: bash
        run: |
          if ! inverse="$(cargo tree -p telomere-component -e normal --no-default-features --features simd -i tokio)"; then
            echo '::error::cargo tree guard failed'
            exit 1
          fi
          if [[ -n "$inverse" ]]; then
            echo '::error::tokio is present in telomere-component minimal normal graph'
            printf '%s\n' "$inverse"
            exit 1
          fi

      - name: Test parser feature gates without threads
        run: cargo test -p telomere --no-default-features --features simd --test parser_feature_gates

      - name: Check telomere without default features
        run: cargo check -p telomere --no-default-features

      - name: Test telomere without default features
        run: cargo test -p telomere --release --no-default-features

  manifest-feature-wiring:
    name: Manifest feature wiring
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96.0"

      - name: Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: feature-policy

      - name: Check feature wiring
        run: python3 tools/check-feature-wiring.py

      - name: Assert minimal embedder graph has no Tokio
        shell: bash
        run: |
          set -uo pipefail
          err="$(mktemp)"
          trap 'rm -f "$err"' EXIT

          out="$(cargo tree --locked -p telomere-minimal-embedder -e normal \
            --no-default-features --target all -i tokio 2>"$err")" && rc=0 || rc=$?

          if [[ "$rc" -eq 0 ]]; then
            if [[ -z "$out" ]]; then
              exit 0
            fi

            echo '::error::Tokio unexpectedly appears in the minimal embedder dependency graph'
            printf '%s\n' "$out"
            exit 1
          fi

          if grep -q 'did not match any packages' "$err"; then
            exit 0
          fi

          echo "::error::cargo tree guard failed (exit $rc)"
          cat "$err"
          exit 1

      - name: Assert the guard can still see Tokio
        shell: bash
        run: |
          set -uo pipefail
          err="$(mktemp)"
          trap 'rm -f "$err"' EXIT

          out="$(cargo tree --locked -p telomere-minimal-embedder -e normal \
            --no-default-features --target all --features threads,wasi -i tokio 2>"$err")" && rc=0 || rc=$?

          if [[ "$rc" -ne 0 ]]; then
            echo "::error::cargo tree positive control failed (exit $rc)"
            cat "$err"
            exit 1
          fi

          if [[ -z "$out" ]]; then
            echo '::error::Tokio positive control produced no inverse dependency tree'
            cat "$err"
            exit 1
          fi

          printf '%s\n' "$out"

  jit-native-test:
    name: JIT tests (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-apple-darwin
            os: macos-15-intel
          - target: aarch64-apple-darwin
            os: macos-14

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96.0"
          targets: ${{ matrix.target }}

      - name: Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: jit-native-${{ matrix.target }}

      - name: Check JIT target
        run: cargo check -p telomere --features jit --target ${{ matrix.target }}

      - name: JIT regression tests
        run: cargo test -p telomere --release --features jit --target ${{ matrix.target }} --test jit

      - name: JIT CLI smoke test
        shell: bash
        run: |
          output="$(cargo run --quiet --features jit --target ${{ matrix.target }} -- --jit examples/add.wasm main 1 2)"
          if [ "$output" != "3" ]; then
            echo "expected 3, got: $output"
            exit 1
          fi

      - name: JIT wast conformance
        env:
          TELOMERE_WAST_JIT: "1"
          TELOMERE_WAST_JIT_REQUIRE_ACCEPT: "1"
        run: cargo test -p telomere --release --features jit --target ${{ matrix.target }} --test wast

  jit-cross-check:
    name: JIT cross-check (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - riscv64gc-unknown-linux-gnu

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96.0"
          targets: ${{ matrix.target }}

      - name: Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: jit-cross-${{ matrix.target }}

      - name: Check core JIT target
        run: cargo check -p telomere --features jit --target ${{ matrix.target }}

      - name: Check CLI JIT target
        run: cargo check -p telomere-cli --features jit --target ${{ matrix.target }}

  packaging:
    name: Packaging metadata
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96.0"

      - name: Cache
        uses: Swatinem/rust-cache@v2

      - name: Check packaging metadata
        run: python3 tools/check-packaging.py

  memory-32bit-check:
    name: 32-bit memory reservation
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96.0"
          targets: i686-unknown-linux-gnu

      - name: Install 32-bit linker support
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-multilib

      - name: Run checked reservation arithmetic tests
        run: cargo test -p telomere --lib --target i686-unknown-linux-gnu reservation_bytes_are_checked_on_every_target

  embedder-configs:
    name: Embedder configuration (${{ matrix.config }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - config: core
            bin: embed-core
            features: simd
            fixture: examples/add.wasm
            expected: "3"
          - config: core-nosimd
            bin: embed-core
            features: ""
            fixture: examples/add.wasm
            expected: "3"
          - config: component
            bin: embed-component
            features: simd,component
            fixture: examples/component-add.wasm
            expected: "42"
          - config: wasi
            bin: embed-wasi
            features: simd,wasi
            fixture: examples/wasi-component-args.wasm
            expected: "0"
          - config: core-jit
            bin: embed-core
            features: simd,jit
            fixture: examples/add.wasm
            expected: "3"
          - config: wasi-threads
            bin: embed-wasi
            features: simd,threads,wasi
            fixture: examples/wasi-component-args.wasm
            expected: "0"

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96.0"

      - name: Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: embedder-configs-${{ matrix.config }}

      - name: Build and assert embedder stdout
        shell: bash
        env:
          BIN: ${{ matrix.bin }}
          FEATURES: ${{ matrix.features }}
          FIXTURE: ${{ matrix.fixture }}
          EXPECTED: ${{ matrix.expected }}
        run: |
          set -euo pipefail
          build=(cargo build -p telomere-minimal-embedder --profile release-size --no-default-features --bin "$BIN")
          if [[ -n "$FEATURES" ]]; then
            build+=(--features "$FEATURES")
          fi
          "${build[@]}"

          actual="$(mktemp)"
          expected="$(mktemp)"
          trap 'rm -f "$actual" "$expected"' EXIT
          "target/release-size/$BIN" "$FIXTURE" >"$actual"
          printf '%s\n' "$EXPECTED" >"$expected"
          if ! cmp -s "$expected" "$actual"; then
            echo "::error::unexpected stdout for $BIN with $FIXTURE"
            diff -u "$expected" "$actual"
            exit 1
          fi

  size-profile-guard:
    name: Release-size profile guard
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96.0"

      - name: Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: size-profile-guard

      - name: Test release-size call threading
        run: cargo test -p telomere --profile release-size --test call_threading

      - name: Test release-size wast conformance
        run: cargo test -p telomere --profile release-size --test wast

  feature-coverage:
    name: Feature coverage
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96.0"

      - name: Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: feature-coverage

      - name: Check telomere feature coverage
        run: cargo check -p telomere --all-features --all-targets

      - name: Check CLI feature coverage
        run: cargo check --all-features --all-targets
