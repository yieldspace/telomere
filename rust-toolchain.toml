# Pinned deliberately.
#
# Rust 1.97.0 breaks the interpreter's tail-call threading contract: the
# direct-threaded dispatch loop is no longer tail-call optimised, so every
# Wasm-level call consumes host stack and call-heavy modules overflow the
# stack in release builds. Reproduced on aarch64-apple-darwin and
# x86_64-unknown-linux-gnu; 1.96.0 passes and 1.97.0 aborts on the same
# commit. The `release_call_loop_keeps_direct_threading` regression test
# exists to catch exactly this.
#
# Known good: 1.86.0 (MSRV) through 1.96.0.
# Known broken: 1.97.0.
#
# Remove this pin once the dispatch loop no longer depends on an
# optimisation that stable Rust does not guarantee.
[toolchain]
channel = "1.96.0"
components = ["clippy", "rustfmt"]
