[package]
name = "telomere-component"
description = "WebAssembly Component Model decoder, IR, linker, and runtime for telomere."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
keywords.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
telomere = { path = "../telomere", default-features = false, features = ["unstable-internals"] }
sha2 = "0.10.9"
thiserror = "2.0.11"
tracing = { version = "0.1.41" }
num-derive = "0.4.2"
num-traits = "0.2.19"
semver = "1.0.26"
typed-arena = "2.0.2"
smallvec.workspace = true

[dev-dependencies]
futures = "0.3.31"
tracing-subscriber = { version = "0.3.19" }
wast = { version = "263.0.0", features = ["component-model"] }
wat = "1.263.0"
anyhow = { version = "1.0.98", features = ["backtrace"] }
criterion = { version = "0.6.0", features = ["async_tokio", "html_reports"] }
tokio = { workspace = true, default-features = false, features = ["macros", "rt", "rt-multi-thread", "time", "sync"] }
# Enables the feature-gated canonical ABI fuzz adapter for this crate's own
# tests, so `cargo test --workspace` replays the committed `canon_lift_args`
# corpus without anyone having to remember `--features fuzzing`. Normal builds
# of the crate are unaffected. `default-features = false` is load-bearing:
# without it, this self dev-dependency re-enables the default features (simd
# and threads) in every `--all-targets` build, which silently defeats the
# feature-coverage cells that check this crate with each flag isolated
# (mirroring the `telomere` crate's self dev-dependency).
telomere-component = { path = ".", default-features = false, features = ["fuzzing"] }

[[bench]]
name = "telomere_component_bench"
harness = false

[[bench]]
name = "component_bundle_load"
harness = false
required-features = ["aot-bundle"]

[features]
default = ["simd", "threads"]
simd = ["telomere/simd"]
threads = ["telomere/threads"]
fuzzing = []
# Component bundles (#201): hash-keyed AoT artifacts for the core
# modules embedded in a component, with a signed bundle container and
# install-at-instantiate. Building artifacts needs the core producer
# and installing them needs the emit-gated patching backends, so this
# turns on the core `jit` feature (which includes `aot-load`).
aot-bundle = ["telomere/jit"]
component-gated-feature-async = []
