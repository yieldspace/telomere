[package]
name = "telomere"
description = "Core WebAssembly parser, optimizer, interpreter, and optional baseline JIT for the telomere runtime."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
keywords.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
wide = { version = "0.7.32", optional = true }
thiserror = "2.0.11"
tracing = { version = "0.1.41", features = ["release_max_level_off"] }
telomere-macros.workspace = true
futures = "0.3.31"
tokio = { workspace = true, optional = true, default-features = false, features = ["sync", "time"] }
parking_lot = "0.12.5"
libc.workspace = true
smallvec.workspace = true
telomere-jit-codegen = { workspace = true, optional = true }

[dev-dependencies]
telomere = { path = ".", default-features = false, features = ["unstable-internals"] }
futures = "0.3.31"
libtest-mimic = "0.8.2"
proc-macro2 = "1.0.95"
quote = "1.0.40"
syn = { version = "2.0.100", features = ["full", "visit"] }
tokio = { workspace = true, default-features = false, features = ["macros", "rt", "rt-multi-thread", "time", "sync"] }
wast = { version = "243.0.0", features = ["component-model"] }
wat = "1.243.0"
sha2 = "0.10.9"
criterion = { version = "0.6.0", features = ["async_tokio", "html_reports"] }
[[bench]]
name = "telomere_bench"
harness = false

[[test]]
name = "wast"
path = "tests/harnesses/wast.rs"
harness = false


[features]
default = [
    "simd",
    "threads",
]
simd = ["dep:wide"]
threads = ["dep:tokio"]
vm-profile = []
vm-diagnostics = []
measure-switches = []
unstable-internals = []
jit = ["dep:telomere-jit-codegen"]
