[package]
name = "telomere"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
keywords.workspace = true

[dependencies]
wide = { version = "0.7.32", optional = true }
thiserror = "2.0.11"
tracing = { version = "0.1.41", features = ["release_max_level_off"] }
num-derive = "0.4.2"
num-traits = "0.2.19"
regex.workspace = true
once_cell = "1.21.3"
union-find.workspace = true
telomere-macros.workspace = true
futures = "0.3.31"
tokio.workspace = true
parking_lot = "0.12.5"
libc.workspace = true

[dev-dependencies]
futures = "0.3.31"
libtest-mimic = "0.8.2"
syn = { version = "2.0.100", features = ["full"] }
tokio.workspace = true
wast = { version = "243.0.0", features = ["component-model"] }
wat = "1.243.0"
criterion = { version = "0.6.0", features = ["async_tokio", "html_reports"] }
[[bench]]
name = "telomere_bench"
harness = false

[[test]]
name = "wast"
path = "tests/harnesses/wast.rs"
harness = false


[features]
default = [
    "simd",
    "threads",
]
simd = ["wide"]
threads = []
vm-profile = []
vm-diagnostics = []
full = [
    "simd",
    "threads",
]
