[package]
name = "telomere"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
keywords.workspace = true


[dependencies]
wide = { version = "0.7.32", optional = true }
thiserror = "2.0.11"
tracing = { version = "0.1.41" }
num-derive = "0.4.2"
num-traits = "0.2.19"
regex.workspace = true
once_cell = "1.21.3"
union-find.workspace = true
telomere-macros.workspace = true
futures = { version = "0.3.31", optional = true }
tokio = { workspace = true, optional = true }

[dev-dependencies]
wast = { version = "243.0.0", features = ["component-model"] }
wat = "1.243.0"
criterion = { version = "0.6.0", features = ["async_tokio", "html_reports"] }
[[bench]]
name = "telomere_bench"
harness = false


[features]
default = ["interpreter", "simd", "async-runtime"]
interpreter = []
simd = ["wide"]
async-runtime = ["tokio", "futures"]
