[package]
name = "telomere"
description = "Core WebAssembly parser, optimizer, interpreter, and optional baseline JIT for the telomere runtime."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
keywords.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
wide = { version = "0.7.32", optional = true }
thiserror = "2.0.11"
tracing = "0.1.41"
telomere-macros.workspace = true
futures = "0.3.31"
tokio = { workspace = true, optional = true, default-features = false, features = ["sync"] }
parking_lot = "0.12.5"
libc.workspace = true
smallvec.workspace = true
telomere-jit-codegen = { workspace = true, optional = true }

[dev-dependencies]
telomere = { path = ".", default-features = false, features = ["unstable-internals"] }
tracing = "0.1.41"
futures = "0.3.31"
libtest-mimic = "0.8.2"
proc-macro2 = "1.0.95"
quote = "1.0.40"
syn = { version = "2.0.100", features = ["full", "visit"] }
tokio = { workspace = true, default-features = false, features = ["macros", "rt", "rt-multi-thread", "time", "sync"] }
wast = { version = "243.0.0", features = ["component-model"] }
wat = "1.243.0"
sha2 = "0.10.9"
criterion = { version = "0.6.0", features = ["async_tokio", "html_reports"] }
[[bench]]
name = "telomere_bench"
harness = false

[[bench]]
name = "aot_cold_start"
harness = false

[[test]]
name = "wast"
path = "tests/harnesses/wast.rs"
harness = false


[features]
default = [
    "simd",
    "threads",
]
simd = ["dep:wide"]
threads = ["dep:tokio"]
vm-profile = []
vm-diagnostics = []
measure-switches = []
unstable-internals = []
# Executing precompiled native code: the JIT cache / load path, runtime
# stubs, the native-call ABI, and executable code memory -- but no compiler.
# An `aot-load` build can run code installed into the cache by an AoT loader
# and reports every runtime compile request as `VMResult::Unimplemented`
# (the interpreter takes over), exactly like a JIT-rejected function.
aot-load = ["dep:telomere-jit-codegen"]
# Compiling WebAssembly to native code at runtime. Implies `aot-load` and
# adds the emitter backends plus the codegen crate's assemblers.
jit = ["aot-load", "telomere-jit-codegen/emit"]

# NOTE(#132): this crate does not inherit [workspace.lints] yet. The
# unsafe_op_in_unsafe_fn ratchet is enforced per subtree instead, via
# `#![deny(unsafe_op_in_unsafe_fn)]` in src/parser.rs, src/common.rs,
# and src/binary/mod.rs. The runtime subtree still has 2,304 measured
# open sites (2,306 workspace-wide before this change, whose 2
# common-layer sites it fixed; see docs/unsafe-policy.md). When
# a subtree reaches zero it gains the same deny; once src/runtime/
# reaches zero this crate switches to `[lints] workspace = true` and
# the per-subtree attributes come out.
