[package]
name = "telomere-jit-codegen"
description = "Executable memory and code emission helpers for the telomere baseline JIT."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
keywords.workspace = true
publish.workspace = true
license.workspace = true

[features]
# The per-architecture macro assemblers (`arch`) and the assembler error
# surface (`masm`). Only code that *emits* native code needs this; the
# executable-memory and target modules are what an AoT loader links.
emit = []

[dev-dependencies]
# The crate's own tests assemble test stubs, so they build with `emit` even
# though the feature is off by default.
telomere-jit-codegen = { path = ".", features = ["emit"] }

[dependencies]

[target.'cfg(unix)'.dependencies]
libc.workspace = true

# mmap-rs is used only for the standalone code mapping on non-Unix
# targets. Its Unix backend declares the libgcc builtin `__clear_cache`
# as an unconditional extern, which fails to link where the toolchain
# never provides that symbol (Rust's self-contained musl linking);
# the Unix mapping is implemented directly on libc in code_memory.rs.
[target.'cfg(not(unix))'.dependencies]
mmap-rs.workspace = true

[lints]
workspace = true
